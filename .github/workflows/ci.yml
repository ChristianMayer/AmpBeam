# Builds, tests and enforces the coverage gate on Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux build, tests and formatting
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          modules: "qtconnectivity"
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format

      - name: Export Qt host path for CMake presets
        run: echo "QT_HOST_PATH=${QT_ROOT_DIR}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        run: ctest --preset linux-release

      - name: Check indentation policy
        run: |
          # Two spaces, never tabs (see docs/development.md). Makefile recipes
          # are excluded because the format requires a leading tab.
          if grep -rnP '^\t' \
              --include='*.cpp' --include='*.h' --include='*.hpp' \
              --include='*.qml' --include='*.txt' --include='*.cmake' \
              --include='*.json' --include='*.yml' --include='*.sh' \
              --include='*.py' core ble cli app tests docs cmake \
              CMakeLists.txt CMakePresets.json; then
            echo "::error::Tab characters found; this project indents with two spaces."
            exit 1
          fi

      - name: Check C++ formatting
        run: |
          find core ble cli app tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  coverage:
    name: Line coverage gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          modules: "qtconnectivity"
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++
          gcov --version

      - name: Export Qt host path for CMake presets
        run: echo "QT_HOST_PATH=${QT_ROOT_DIR}" >> "$GITHUB_ENV"

      - name: Configure with coverage
        run: cmake --preset linux-coverage

      - name: Build
        run: cmake --build --preset linux-coverage

      # Runs every suite, then tests/coverage/coverage_gate.py, which fails
      # unless every source in tests/coverage/required.txt is at 100% line
      # coverage. See docs/testing.md.
      - name: Test and enforce coverage
        run: ctest --preset linux-coverage
